name: Build VisionClaw iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Unsigned iOS IPA
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Prepare Secrets.swift
        working-directory: samples/CameraAccess/CameraAccess
        run: |
          cp Secrets.swift.example Secrets.swift
          sed -i '' 's/YOUR_OPENCLAW_GATEWAY_TOKEN/modelark2026/g' Secrets.swift
          sed -i '' 's/http:\/\/YOUR_MAC_HOSTNAME.local/http:\/\/192.168.1.229/g' Secrets.swift
          if [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
            sed -i '' "s/YOUR_GEMINI_API_KEY/${{ secrets.GEMINI_API_KEY }}/g" Secrets.swift
          fi

      - name: Build CameraAccess (.app)
        working-directory: samples/CameraAccess
        run: |
          xcodebuild clean build \
            -project CameraAccess.xcodeproj \
            -scheme CameraAccess \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CONFIGURATION_BUILD_DIR="$(pwd)/build/Release-iphoneos"

      - name: Package IPA
        working-directory: samples/CameraAccess
        run: |
          mkdir -p build/Payload
          cp -r build/Release-iphoneos/CameraAccess.app build/Payload/
          cd build
          zip -qr CameraAccess.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CameraAccess-iOS-IPA
          path: samples/CameraAccess/build/CameraAccess.ipa
          retention-days: 7
